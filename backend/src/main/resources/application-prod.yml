spring:
  datasource:
    # 실제 url/username/password는 DatabaseUrlEnvironmentPostProcessor가
    # DATABASE_URL(libpq 형식)을 파싱해 주입함 — 아래는 해당 파싱이 실패할 경우의 fallback
    url: jdbc:${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        sslmode: require
        sslfactory: org.postgresql.ssl.NonValidatingFactory
        # Supabase 풀러(Supavisor) 트랜잭션 모드는 서버 사이드 prepared statement를 지원하지 않는다.
        # PgJDBC 기본값(prepareThreshold=5)이면 같은 쿼리 5회째부터 "prepared statement S_n does not exist /
        # already exists"로 실패한다(health는 prepared statement를 안 써서 UP으로 보임) → 0으로 끈다.
        # (예전의 cachePrepStmts/prepStmtCacheSize/useServerPrepStmts는 MySQL 드라이버 속성이라 PgJDBC는 무시했다.)
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  h2:
    console:
      enabled: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 3000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 200
    accept-count: 100

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://happiness.io.kr,https://www.happiness.io.kr,https://happiness-app-eight.vercel.app}

logging:
  level:
    root: WARN
    com.happiness: INFO
  pattern:
    console: '{"time":"%d{ISO8601}","level":"%level","trace":"%X{traceId}","logger":"%logger{36}","msg":"%msg"}%n'

management:
  endpoint:
    health:
      show-details: never
