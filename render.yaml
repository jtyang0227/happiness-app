# Render 무료(Free) 플랜 — Railway($5/월) 대신 백엔드를 무료로 돌리는 설정 (Blueprint).
# render.com › New › Blueprint › 이 저장소 선택 → 아래 sync:false 값들을 대시보드에서 입력.
# 무료 플랜: 512MB, 15분 무요청 시 잠듦(첫 요청 30~60초) — .github/workflows/keepalive.yml이 10분마다 깨운다.
services:
  - type: web
    name: happiness-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: images
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://happiness.io.kr,https://www.happiness.io.kr,https://happiness-app.pages.dev
      - key: FRONTEND_URL
        value: https://happiness.io.kr
      - key: GEMINI_API_KEY
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
