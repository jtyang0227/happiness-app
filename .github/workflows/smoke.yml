name: Smoke (컷오버 점검)

# TS 전환 컷오버(PROMPT_ts-cutover.md "B 상세") 각 단계 뒤에 Actions 탭에서 수동 실행한다.
# 읽기 위주 확인만 한다(쓰기는 존재하지 않는 계정의 로그인 실패 1번). 주소를 비운 대상은 건너뛴다.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: '앱 API 주소 (예: https://api.happiness.io.kr)'
        required: false
      admin_api_url:
        description: '어드민 API 주소'
        required: false
      web_url:
        description: '웹 주소 (예: https://happiness.io.kr)'
        required: false
      admin_web_url:
        description: '어드민 웹 주소'
        required: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke
        env:
          API_URL: ${{ inputs.api_url }}
          ADMIN_API_URL: ${{ inputs.admin_api_url }}
          WEB_URL: ${{ inputs.web_url }}
          ADMIN_WEB_URL: ${{ inputs.admin_web_url }}
        run: |
          set -- 
          [ -n "$API_URL" ] && set -- "$@" --api "$API_URL"
          [ -n "$ADMIN_API_URL" ] && set -- "$@" --admin-api "$ADMIN_API_URL"
          [ -n "$WEB_URL" ] && set -- "$@" --web "$WEB_URL"
          [ -n "$ADMIN_WEB_URL" ] && set -- "$@" --admin-web "$ADMIN_WEB_URL"
          node apps/api/scripts/smoke.mjs "$@"
